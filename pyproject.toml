[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Learn about Deep Research Agents and how to implement them. Learn to use new tooling, frameworks, and try improve personal research workflows. Code originally typed by hand, for learning purposes."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.86.0",
    "exa-py>=2.10.2",
    "logfire>=4.31.0",
    "openai>=2.30.0",
    "pydantic-ai-slim[anthropic,logfire,openai]>=1.73.0",
    "python-dotenv>=1.2.2",
]
